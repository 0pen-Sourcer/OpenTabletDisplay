name: Polish and publish OpenTabletDisplay 3.1.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-v3.1.1.yml'

permissions:
  contents: write
  issues: write

jobs:
  polish-release:
    if: github.repository == '0pen-Sourcer/OpenTabletDisplay'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply guarded 3.1.1 polish
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s) of {old!r}, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact('internal/bridge/constants.go', 'Version = "3.1.0"', 'Version = "3.1.1"')
          replace_exact('installer/common.ps1', "$script:FSDLVersion = '3.1.0'", "$script:FSDLVersion = '3.1.1'")
          replace_exact('internal/bridge/daemon.go', 'a.Out("FSDL USB agent %s", Version)', 'a.Out("OpenTabletDisplay USB agent %s", Version)')

          replace_exact('installer/install.ps1', "throw 'FSDL 3.1.0 requires 64-bit Windows 10 or 11.'", "throw ('OpenTabletDisplay ' + $script:FSDLVersion + ' requires 64-bit Windows 10 or 11.')")
          replace_exact('installer/install.ps1', "Set-Content -LiteralPath $logPath -Value ('FSDL ' + $script:FSDLVersion + ' install ' + (Get-Date -Format o)) -Encoding UTF8", "Set-Content -LiteralPath $logPath -Value ('OpenTabletDisplay ' + $script:FSDLVersion + ' install ' + (Get-Date -Format o)) -Encoding UTF8")
          replace_exact('installer/install.ps1', "Write-FSDLLog 'Starting FSDL install/update. Existing Sunshine credentials and pairings are preserved.' $logPath", "Write-FSDLLog 'Starting OpenTabletDisplay install/update. Existing Sunshine credentials and pairings are preserved.' $logPath")
          replace_exact('installer/install.ps1', "Write-FSDLLog ('Installed FSDL binaries under ' + $script:InstallRoot) $logPath", "Write-FSDLLog ('Installed OpenTabletDisplay runtime files under ' + $script:InstallRoot) $logPath")
          replace_exact('installer/install.ps1', "'Sunshine Web UI credentials created by FSDL on ' + (Get-Date -Format o),", "'Sunshine Web UI credentials created by OpenTabletDisplay on ' + (Get-Date -Format o),")
          replace_exact('installer/install.ps1', "-Description 'Keeps FSDL wired Android display transport available in the background.'", "-Description 'Keeps OpenTabletDisplay wired Android display transport available in the background.'")
          replace_exact('installer/install.ps1', "-Name DisplayName -Value 'FSDL Wired Android Display'", "-Name DisplayName -Value 'OpenTabletDisplay'")
          replace_exact('installer/install.ps1', "Write-Host 'FSDL IS INSTALLED.' -ForegroundColor Green", "Write-Host 'OpenTabletDisplay is installed.' -ForegroundColor Green")

          replace_exact('installer/status.ps1', "Write-Host ('FSDL ' + $script:FSDLVersion + ' status') -ForegroundColor Cyan", "Write-Host ('OpenTabletDisplay ' + $script:FSDLVersion + ' status') -ForegroundColor Cyan")
          replace_exact('installer/uninstall.ps1', "Write-FSDLLog 'Starting FSDL uninstall.' $logPath", "Write-FSDLLog 'Starting OpenTabletDisplay uninstall.' $logPath")
          replace_exact('installer/uninstall.ps1', "Write-Host 'FSDL removed. Sunshine/VDD were preserved unless -RemoveDependencies was explicitly requested and ownership was recorded.' -ForegroundColor Green", "Write-Host 'OpenTabletDisplay removed. Sunshine/VDD were preserved unless -RemoveDependencies was explicitly requested and ownership was recorded.' -ForegroundColor Green")

          replace_exact('docs/COMPATIBILITY.md', "FSDL's installer can install its pinned Sunshine and Virtual Display Driver versions, or reuse an existing compatible installation.", "OpenTabletDisplay's installer can install its pinned Sunshine and Virtual Display Driver versions, or reuse an existing compatible installation. The 3.x runtime intentionally retains legacy FSDL internal names for upgrade compatibility.")
          replace_exact('docs/TROUBLESHOOTING.md', 'Android enrollment, FSDL doctor output, and the recent agent log.', 'Android enrollment, OpenTabletDisplay/FSDL runtime doctor output, and the recent agent log.')
          replace_exact('THIRD_PARTY_NOTICES.md', 'FSDL intentionally does not vendor Sunshine, Moonlight, Virtual Display Driver, Android Platform Tools, NefCon, or gnirehtet into the source repository.', 'OpenTabletDisplay intentionally does not vendor Sunshine, Moonlight, Virtual Display Driver, Android Platform Tools, NefCon, or gnirehtet into the source repository.')

          replace_exact('CHANGELOG.md', '## Unreleased — OpenTabletDisplay public rebrand', '## 3.1.1 — OpenTabletDisplay public release polish (2026-10-25)')
          marker = '- Runtime executable, install path, scheduled-task name, state files, and Go module imports are intentionally **not** renamed in this docs-first pass; that migration requires an explicit compatibility/rollback plan.'
          replace_exact('CHANGELOG.md', marker, marker + '\n- User-visible installer, status, uninstall, scheduled-task description, daemon banner, and Windows Apps display name now use **OpenTabletDisplay** while legacy internal identifiers remain stable.\n- Release ZIPs now ship with a detached SHA-256 file in addition to the in-package checksum manifest.\n- Added project badges, a roadmap, a device-testing guide/template, and clearer release/discovery surfaces.')

          replace_exact('README.md', '# OpenTabletDisplay\n\n', '# OpenTabletDisplay\n\n[![CI](https://github.com/0pen-Sourcer/OpenTabletDisplay/actions/workflows/ci.yml/badge.svg)](https://github.com/0pen-Sourcer/OpenTabletDisplay/actions/workflows/ci.yml) [![Release](https://img.shields.io/github/v/release/0pen-Sourcer/OpenTabletDisplay)](https://github.com/0pen-Sourcer/OpenTabletDisplay/releases/latest) [![License: MIT](https://img.shields.io/badge/License-MIT-yellow.svg)](LICENSE) [![Windows](https://img.shields.io/badge/Windows-10%20%7C%2011-0078D4)](docs/COMPATIBILITY.md)\n\n')
          replace_exact('README.md', '1. Download the latest **Windows release ZIP** and extract it.', '1. Download the latest **Windows release ZIP** from [Releases](https://github.com/0pen-Sourcer/OpenTabletDisplay/releases/latest) and extract it.')
          replace_exact('README.md', '- [Troubleshooting](docs/TROUBLESHOOTING.md)\n- [Security](SECURITY.md)', '- [Troubleshooting](docs/TROUBLESHOOTING.md)\n- [Device testing](docs/DEVICE_TESTING.md)\n- [Roadmap](docs/ROADMAP.md)\n- [Security](SECURITY.md)')

          replace_exact('scripts/build-release.sh', 'sha256sum "$ROOT/dist/$PACKAGE.zip"\necho "Built: $ROOT/dist/$PACKAGE.zip"', 'ZIP="$ROOT/dist/$PACKAGE.zip"\nsha256sum "$ZIP" | tee "$ZIP.sha256"\necho "Built: $ZIP"')
          replace_exact('scripts/build-release.ps1', "Compress-Archive -LiteralPath $Out -DestinationPath $zip -CompressionLevel Optimal\nWrite-Host ('SHA256 ' + (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant())\nWrite-Host ('Built: ' + $zip)", "Compress-Archive -LiteralPath $Out -DestinationPath $zip -CompressionLevel Optimal\n$zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()\n($zipHash + '  ' + [IO.Path]::GetFileName($zip)) | Set-Content -LiteralPath ($zip + '.sha256') -Encoding ASCII\nWrite-Host ('SHA256 ' + $zipHash)\nWrite-Host ('Built: ' + $zip)")

          Path('docs/ROADMAP.md').write_text('''# Roadmap\n\nOpenTabletDisplay is deliberately keeping the media stack boring: Sunshine encodes, Moonlight decodes, and this project owns the Windows-display + wired-Android integration.\n\n## Near term\n\n- Expand the real-device compatibility matrix beyond the Lenovo Tab M10 HD.\n- Keep install/update/uninstall transactional and preserve user-owned Sunshine/VDD configuration.\n- Improve first-run diagnostics and make failure reports safe to share.\n- Add Authenticode signing when a maintainable signing identity/certificate is available. Until then, releases publish detached SHA-256 checksums and reproducible CI artifacts.\n\n## Next architecture milestone\n\nRemove the current dependency on the Windows host's active physical IPv4 address as Sunshine/Moonlight identity. The goal is an OpenTabletDisplay-owned host-only identity so the wired display session does not depend on LAN/Wi-Fi state. This should not ship until it is hardware-validated for both TCP and UDP.\n\n## Later\n\n- Broaden Android architecture/device validation if real-world reports justify it.\n- Evaluate a native USB transport only if ADB + gnirehtet becomes the measured bottleneck; do not replace a proven component for novelty.\n- Consider a carefully migrated 4.x runtime rename that removes legacy `FSDL` internal identifiers without breaking 3.x upgrades or uninstall.\n''', encoding='utf-8')

          Path('docs/DEVICE_TESTING.md').write_text('''# Device testing\n\nReal Android hardware reports are the highest-value contribution right now. OpenTabletDisplay intentionally does not claim universal Android compatibility from CI alone.\n\n## What to test\n\n1. Install the latest release on Windows 10 or 11 x86-64.\n2. Use an Android tablet/phone with USB debugging enabled and normal Android USB tethering disabled.\n3. Complete first-run enrollment and Moonlight pairing.\n4. Verify a real extended desktop, direct-touch behavior if desired, audio routing, cable reconnect, Windows logon reconnect, and a 10+ minute 60 FPS session.\n5. Run `status.cmd` after the test.\n\n## Report\n\nUse the **Device compatibility report** issue template and include the Android model/version, Windows/GPU, cable/port if known, health checks, video/input/audio/reconnect results, Moonlight settings/performance observations, and sanitized `status.cmd` output. Never post Sunshine passwords, pairing PINs, private keys, or unrelated personal data.\n''', encoding='utf-8')

          Path('.github/ISSUE_TEMPLATE/device_test.yml').write_text('''name: Device compatibility report\ndescription: Report a real Android device tested with OpenTabletDisplay\ntitle: "[Device] "\nlabels: ["help wanted"]\nbody:\n  - type: input\n    id: device\n    attributes:\n      label: Android device\n      placeholder: Samsung Galaxy Tab S8 / Android 14\n    validations:\n      required: true\n  - type: input\n    id: host\n    attributes:\n      label: Windows host\n      placeholder: Windows 11 24H2, RTX 4060\n    validations:\n      required: true\n  - type: dropdown\n    id: result\n    attributes:\n      label: Overall result\n      options: [Works, Works with issues, Does not work]\n    validations:\n      required: true\n  - type: textarea\n    id: details\n    attributes:\n      label: Results / sanitized status output\n      description: Include enrollment, TCP+UDP, pairing, video, input, audio, reconnect and 10+ minute 60 FPS results. Do not include credentials or PINs.\n''', encoding='utf-8')

          Path('docs/releases').mkdir(parents=True, exist_ok=True)
          Path('docs/releases/v3.1.1.md').write_text('''# OpenTabletDisplay v3.1.1\n\nThe first release carrying the OpenTabletDisplay public identity end-to-end.\n\n## Highlights\n\n- Public installer/status/uninstall surfaces now say **OpenTabletDisplay** while 3.x internal FSDL identifiers remain stable for compatibility.\n- Public package name is `OpenTabletDisplay-3.1.1-windows-x64.zip`.\n- Detached SHA-256 checksum ships next to the release ZIP; the package still includes its full `SHA256SUMS.txt` manifest.\n- Added a device-testing path and public roadmap to make real-world Android validation easier.\n- No Lenovo-specific runtime ID or hard-coded tablet resolution was introduced.\n\n## Compatibility\n\nThis is an in-place 3.x update. Existing Sunshine credentials, Moonlight pairings, virtual-display configuration ownership, enrollment state, and legacy internal FSDL paths/tasks are intentionally preserved.\n\n## Known boundary\n\nThe wired stream itself travels through USB, but Moonlight/Sunshine identity still depends on an active physical Windows IPv4/default route. A host-only identity is the next architecture milestone.\n\n## Windows trust\n\nThe project does not yet have an Authenticode signing identity. Verify the detached SHA-256 checksum and the in-package manifest when downloading a release.\n''', encoding='utf-8')

      - name: Parse PowerShell
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem installer -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $failed = $true; $errors | Format-List | Out-String | Write-Host }
          }
          if ($failed) { exit 1 }

      - name: Full validation
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
          go test ./...
          go vet ./...
          go test -race ./...
          go run ./cmd/fsdl --selftest
          ./scripts/build-release.sh
          test -f dist/OpenTabletDisplay-3.1.1-windows-x64.zip
          test -f dist/OpenTabletDisplay-3.1.1-windows-x64.zip.sha256
          sha256sum -c dist/OpenTabletDisplay-3.1.1-windows-x64.zip.sha256

      - name: Commit polished product files to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md THIRD_PARTY_NOTICES.md docs installer internal scripts .github/ISSUE_TEMPLATE/device_test.yml
          git commit -m 'release: OpenTabletDisplay 3.1.1 polish'
          git push origin HEAD:main

      - name: Publish v3.1.1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git tag -a v3.1.1 -m 'OpenTabletDisplay v3.1.1'
          git push origin v3.1.1
          gh release create v3.1.1 \
            dist/OpenTabletDisplay-3.1.1-windows-x64.zip \
            dist/OpenTabletDisplay-3.1.1-windows-x64.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title 'OpenTabletDisplay v3.1.1' \
            --notes-file docs/releases/v3.1.1.md \
            --verify-tag

      - name: Open contributor traction issues
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title '[Testing] Expand the Android compatibility matrix' --label 'help wanted' --body 'We need real-device reports beyond the Lenovo Tab M10 HD. Use the Device compatibility report template and docs/DEVICE_TESTING.md. Highest-value data: Android model/version, Windows/GPU, TCP+UDP health checks, Moonlight video/input/audio, reconnect, and a 10+ minute 60 FPS session. Please sanitize status output.' || true
          gh issue create --repo "$GITHUB_REPOSITORY" --title 'Remove the active physical IPv4 identity dependency' --label 'enhancement' --body 'Today stream packets travel over USB, but Sunshine/Moonlight still use the host active physical IPv4 as identity. Design and hardware-validate an OpenTabletDisplay-owned host-only identity that carries TCP+UDP without depending on LAN/Wi-Fi state. See docs/ROADMAP.md.' || true
          gh issue create --repo "$GITHUB_REPOSITORY" --title 'Add maintainable Windows Authenticode signing' --label 'help wanted' --body 'OpenTabletDisplay release binaries are currently unsigned. Track a maintainable signing identity/certificate and CI signing path without storing private signing material in the repository. Releases already publish detached SHA-256 checksums; signing should complement integrity verification.' || true

      - name: Delete temporary fix branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/fix/polish-v3.1.1-push" >/dev/null 2>&1 || true
