'''
          replace_exact('installer/status.ps1', "$enrollment = Join-Path $script:InstallRoot 'enrollment.json'\n", status_block + "$enrollment = Join-Path $script:InstallRoot 'enrollment.json'\n")

          replace_exact('CHANGELOG.md', '# Changelog\n\n', '# Changelog\n\n## 3.2.0-rc.1 — Host-only identity candidate\n\n- Adds an OpenTabletDisplay-owned private `/32` on the Windows loopback interface so Moonlight/Sunshine no longer need to borrow the host Wi-Fi/Ethernet address when the alias passes validation.\n- Chooses from conflict-checked RFC1918 candidates, marks the alias `SkipAsSource`, persists ownership metadata, and removes only the exact owned alias during rollback/uninstall.\n- Validates Sunshine `LocalIP` locally before enabling the identity and still runs the existing real Android TCP + UDP probes before READY.\n- If live Android validation of the host-only identity fails, the session cleans up and retries the proven 3.1.x physical-address path instead of stranding the user.\n- This remains a release candidate until the host-only path is validated on real Android hardware.\n\n')

      - name: Format and unit tests
        run: |
          test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
          go test ./...
          go vet ./...
          go test -race ./...
          go run ./cmd/fsdl --selftest

      - name: Parse PowerShell
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem installer -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Parse errors in $($_.FullName)" -ForegroundColor Red
              $errors | Format-List | Out-String | Write-Host
            }
          }
          if ($failed) { exit 1 }

      - name: Cross-build candidate package
        run: |
          ./scripts/build-release.sh
          test -f dist/OpenTabletDisplay-3.2.0-rc.1-windows-x64.zip
          test -f dist/OpenTabletDisplay-3.2.0-rc.1-windows-x64.zip.sha256
          sha256sum -c dist/OpenTabletDisplay-3.2.0-rc.1-windows-x64.zip.sha256

      - name: Commit validated candidate source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal installer CHANGELOG.md
          git commit -m 'feat: add managed host-only Moonlight identity'
          git push origin HEAD:feature/host-only-identity

      - name: Upload hardware-test candidate
        uses: actions/upload-artifact@v4
        with:
          name: OpenTabletDisplay-3.2.0-rc.1-windows-x64
          path: |
            dist/OpenTabletDisplay-3.2.0-rc.1-windows-x64.zip
            dist/OpenTabletDisplay-3.2.0-rc.1-windows-x64.zip.sha256
          if-no-files-found: error
