name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go tests and cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l cmd internal)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race
        run: go test -race ./...
      - name: Offline self-test
        run: go run ./cmd/fsdl --selftest
      - name: Cross-build release payload
        run: ./scripts/build-release.sh
  powershell:
    name: Windows installer parse
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap installer log in a clean directory
        shell: powershell
        run: |
          . ./installer/common.ps1
          $root = Join-Path $env:RUNNER_TEMP ('otd-bootstrap-' + [guid]::NewGuid().ToString('N'))
          $logPath = Join-Path $root 'logs\install.log'
          try {
            if (Test-Path $root) { throw 'Expected a clean test directory.' }
            Initialize-FSDLInstallLog $logPath
            if (-not (Test-Path -LiteralPath $logPath)) { throw 'Installer failed to create its first-run log.' }
            $content = Get-Content -LiteralPath $logPath -Raw
            if (-not $content.StartsWith('OpenTabletDisplay ' + $script:FSDLVersion + ' install ')) {
              throw 'Installer log header was not written.'
            }
          } finally {
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: VDD PnP identity regression
        shell: powershell
        run: |
          . ./installer/common.ps1
          function Get-PnpDevice {
            @(
              [pscustomobject]@{ InstanceId='ROOT\DISPLAY\0001'; Status='OK'; HardwareID=@('ROOT\MttVDD') },
              [pscustomobject]@{ InstanceId='ROOT\DISPLAY\0002'; Status='OK'; HardwareID=@('ROOT\Other') }
            )
          }
          function Get-PnpDeviceProperty { param($InstanceId, $KeyName, $ErrorAction) [pscustomobject]@{ Data=@() } }
          $devices = @(Get-FSDLVddDevices)
          if ($devices.Count -ne 1 -or $devices[0].InstanceId -ne 'ROOT\DISPLAY\0001') {
            throw 'VDD detection must use exact hardware IDs, not only ROOT\MTTVDD instance prefixes.'
          }
      - name: Validate desktop WPF layout
        shell: powershell
        run: |
          $raw = [System.IO.File]::ReadAllBytes('installer/desktop.ps1')
          if ($raw.Length -lt 3 -or $raw[0] -ne 239 -or $raw[1] -ne 187 -or $raw[2] -ne 191) {
            throw 'Desktop UI must contain UTF-8 BOM for Windows PowerShell 5.1'
          }
          Add-Type -AssemblyName PresentationFramework
          $source = Get-Content installer/desktop.ps1 -Raw
          $match = [regex]::Match($source, "(?s)\`$xaml = @'[\r\n]+(.*?)[\r\n]+'@")
          if (-not $match.Success) { throw 'Desktop app XAML block is missing.' }
          $xaml = $match.Groups[1].Value
          $document = [xml]$xaml
          if ($document.DocumentElement.LocalName -ne 'Window') { throw 'Desktop app must contain a WPF Window.' }
          $window = [Windows.Markup.XamlReader]::Parse($xaml)
          try {
            if ($window.Title -ne 'OpenTabletDisplay') { throw 'Unexpected window title.' }
            foreach ($name in @('OverviewPage','ConnectPage','DiagnosticsPage','SettingsPage','InstallButton','DiagnosticOutput')) {
              if (-not $window.FindName($name)) { throw ('Missing UI control: ' + $name) }
            }
          } finally {
            $window.Close()
          }
      - name: Exercise desktop controller in smoke mode
        shell: powershell
        run: |
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File installer\desktop.ps1 -SmokeTest
          if ($LASTEXITCODE -ne 0) { throw 'Desktop PowerShell smoke test failed.' }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and inspect the Windows release archive
        shell: powershell
        run: |
          ./scripts/build-release.ps1 -SkipTests
          if ($LASTEXITCODE -ne 0) { throw 'Windows release build failed.' }
          $archive = Get-ChildItem -LiteralPath dist -Filter 'OpenTabletDisplay-*-windows-x64.zip' -File | Select-Object -First 1
          if (-not $archive) { throw 'Release archive was not produced.' }
          $testRoot = Join-Path $env:RUNNER_TEMP 'otd-release-inspection'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $testRoot -Force
          $bundle = Get-Item -LiteralPath $testRoot
          foreach ($required in @('OpenTabletDisplay.exe','assets\OpenTabletDisplay.ico','assets\OpenTabletDisplay.png','installer\desktop.ps1','installer\install.ps1','payload\FSDL.exe','payload\probes\fsdl-probe-android-arm64')) {
            if (-not (Test-Path -LiteralPath (Join-Path $bundle.FullName $required))) { throw ('Release package missing: ' + $required) }
          }
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class IconCheck { [DllImport("shell32.dll", CharSet=CharSet.Unicode)] public static extern uint ExtractIconEx(string file, int index, IntPtr[] large, IntPtr[] small, uint count); }'
          $appExe = Join-Path $bundle.FullName 'OpenTabletDisplay.exe'
          $iconCount = [IconCheck]::ExtractIconEx($appExe, -1, $null, $null, 0)
          if ($iconCount -lt 1) { throw 'Windows Explorer icon missing from packaged executable.' }
          & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File (Join-Path $bundle.FullName 'installer\desktop.ps1') -SmokeTest
          if ($LASTEXITCODE -ne 0) { throw 'Packaged app smoke test failed.' }
          Remove-Item -LiteralPath $testRoot -Recurse -Force
      - name: Parse every PowerShell script
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem installer -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Parse errors in $($_.FullName)" -ForegroundColor Red
              $errors | Format-List | Out-String | Write-Host
            }
          }
          if ($failed) { exit 1 }
      - name: Upload verified Windows release-candidate package
        uses: actions/upload-artifact@v4
        with:
          name: OpenTabletDisplay-Windows-branded-RC2
          path: |
            dist/OpenTabletDisplay-*-windows-x64.zip
            dist/OpenTabletDisplay-*-windows-x64.zip.sha256
          if-no-files-found: error
