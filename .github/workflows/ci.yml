name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go tests and cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l cmd internal)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race
        run: go test -race ./...
      - name: Offline self-test
        run: go run ./cmd/fsdl --selftest
      - name: Cross-build release payload
        run: ./scripts/build-release.sh
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: OpenTabletDisplay-windows-x64
          path: dist/OpenTabletDisplay-*-windows-x64.zip
          if-no-files-found: error

  powershell:
    name: Windows installer parse
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every PowerShell script
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem installer -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Parse errors in $($_.FullName)" -ForegroundColor Red
              $errors | Format-List | Out-String | Write-Host
            }
          }
          if ($failed) { exit 1 }
