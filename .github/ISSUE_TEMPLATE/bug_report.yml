name: Bug report
description: Report a reproducible FSDL problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include Sunshine passwords, private keys, or other credentials."
  - type: input
    id: version
    attributes:
      label: FSDL version
      placeholder: "3.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android device / Android version
      placeholder: "Tablet model, Android 14"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the exact error and what you expected.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: status.cmd output / relevant logs
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Basic checks
      options:
        - label: USB tethering was OFF
        - label: USB debugging was ON and authorized
        - label: I removed credentials/secrets from logs
