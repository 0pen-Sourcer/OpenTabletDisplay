<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OpenTabletDisplay</title>
  <desc id="desc">Turn an Android tablet or phone into a real wired Windows second monitor over USB.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111a31"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#6e40c9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1035" cy="80" r="190" fill="#1f6feb" opacity=".09"/>
  <circle cx="1120" cy="535" r="260" fill="#6e40c9" opacity=".08"/>

  <g transform="translate(70 72)">
    <text x="0" y="60" fill="#f4f7ff" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700">OpenTabletDisplay</text>
    <text x="0" y="112" fill="#aebbd3" font-family="Segoe UI, Arial, sans-serif" font-size="28">Android → real Windows second monitor over USB</text>

    <g transform="translate(0 154)" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">
      <rect width="132" height="40" rx="20" fill="#182744"/><text x="22" y="27" fill="#8ec5ff">Windows 10/11</text>
      <rect x="144" width="100" height="40" rx="20" fill="#182744"/><text x="166" y="27" fill="#8ec5ff">Android</text>
      <rect x="256" width="72" height="40" rx="20" fill="#182744"/><text x="278" y="27" fill="#8ec5ff">USB</text>
      <rect x="340" width="120" height="40" rx="20" fill="#182744"/><text x="362" y="27" fill="#8ec5ff">Open source</text>
    </g>

    <g transform="translate(12 250)" filter="url(#shadow)">
      <!-- Windows monitor -->
      <rect x="0" y="0" width="420" height="236" rx="18" fill="#050914" stroke="#6e7e9f" stroke-width="3"/>
      <rect x="15" y="15" width="390" height="206" rx="10" fill="url(#screen)"/>
      <rect x="176" y="236" width="68" height="34" rx="4" fill="#74809a"/>
      <rect x="120" y="267" width="180" height="15" rx="8" fill="#59657e"/>
      <rect x="41" y="45" width="112" height="72" rx="8" fill="#ffffff" opacity=".14"/>
      <rect x="171" y="45" width="190" height="18" rx="6" fill="#ffffff" opacity=".28"/>
      <rect x="171" y="76" width="155" height="14" rx="5" fill="#ffffff" opacity=".18"/>
      <rect x="41" y="137" width="320" height="48" rx="8" fill="#08111f" opacity=".38"/>

      <!-- USB cable -->
      <path d="M421 142 C500 142 500 229 566 229 C615 229 620 178 670 178" fill="none" stroke="#58a6ff" stroke-width="9" stroke-linecap="round"/>
      <circle cx="529" cy="212" r="9" fill="#58a6ff"/>
      <text x="475" y="118" fill="#9dccff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">USB data</text>

      <!-- Tablet -->
      <rect x="670" y="15" width="310" height="255" rx="30" fill="#050914" stroke="#6e7e9f" stroke-width="3"/>
      <rect x="687" y="32" width="276" height="221" rx="18" fill="#101a2f"/>
      <rect x="701" y="47" width="248" height="191" rx="11" fill="url(#screen)"/>
      <rect x="720" y="68" width="94" height="62" rx="7" fill="#ffffff" opacity=".14"/>
      <rect x="830" y="68" width="98" height="16" rx="5" fill="#ffffff" opacity=".28"/>
      <rect x="830" y="96" width="74" height="12" rx="5" fill="#ffffff" opacity=".18"/>
      <rect x="720" y="151" width="208" height="50" rx="7" fill="#08111f" opacity=".38"/>
      <circle cx="979" cy="143" r="5" fill="#7c8aa6"/>
    </g>

    <text x="0" y="548" fill="#8795b2" font-family="Segoe UI, Arial, sans-serif" font-size="19">Virtual display • Sunshine + Moonlight • ADB + gnirehtet • MIT</text>
  </g>
</svg>
